services:
  lynx:
    image: ghcr.io/pixlgalaxy/lynx:latest
    build:
      context: .
      args:
        LYNX_COMMIT: ${LYNX_COMMIT:-}   # optional: commit shown by /about
    env_file: .env
    ports:
      - "8080:8080"   # nginx: panel at /, backend at /backend/
      # Admin panel (needs ADMIN_PASSWORD). Keep it off the internet: bind it to the LAN address
      # of the host, or put it behind a reverse proxy with an access list.
      # - "81:8081"
    volumes:
      - lynx-appdata:/appdata   # persistent app data (SQLite, yt-dlp updates)
      - lynx-data:/data         # heavy data (stream fragments, caches)
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  lynx-appdata:
  lynx-data:
