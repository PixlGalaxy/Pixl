version: 2
# Runtime and development dependencies are grouped separately (minor/patch only; every major gets
# its own PR). dependabot-auto-merge.yml merges GitHub Actions and development-dependency
# minor/patch PRs once the checks pass; runtime cargo/npm updates and Docker base-image digests
# always wait for a manual review.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "Lynx"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    groups:
      rust-runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      rust-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "Lynx"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    groups:
      web-runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      web-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images in the Dockerfile are pinned by digest; Dependabot bumps tag and digest together.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "Lynx"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    groups:
      docker-deps:
        patterns:
          - "*"

  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Lynx"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"
