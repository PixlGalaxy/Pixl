# nginx inside the Lynx image: serves the Activity panel at / and proxies /backend/ to the Rust
# server on 127.0.0.1:4000 (prefix stripped). Runs as the unprivileged `lynx` user, so every
# writable path points at /tmp and it listens on 8080.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format lynx '$time_iso8601 [nginx] $status $request_method $uri ${body_bytes_sent}b ${request_time}s';
    # Health checks arrive constantly; log them only when they fail.
    map "$status:$uri" $loggable {
        "~^2\d\d:/backend/healthz$" 0;
        default                     1;
    }
    access_log /dev/stdout lynx if=$loggable;

    # WebSocket (/backend/ws) needs the upgrade passed on.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;

        # The panel runs inside Discord's Activity iframe, so X-Frame-Options must NOT be set;
        # frame-ancestors limits embedding to Discord instead.
        add_header Content-Security-Policy "frame-ancestors 'self' https://discord.com https://*.discord.com https://discordapp.com https://*.discordsays.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        root /app/web;
        index index.html;

        # index.html is never cached, so a new build is picked up right away.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "frame-ancestors 'self' https://discord.com https://*.discord.com https://discordapp.com https://*.discordsays.com" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed build output: cache forever. nginx drops server-level add_header lines in a
        # location that sets its own, so they are repeated here.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header Content-Security-Policy "frame-ancestors 'self' https://discord.com https://*.discord.com https://discordapp.com https://*.discordsays.com" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location /backend/ {
            proxy_pass http://127.0.0.1:4000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_hide_header X-Content-Type-Options;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
