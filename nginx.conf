# nginx inside the Lynx image: serves the Activity panel at / and proxies /backend/ to the Rust
# server on 127.0.0.1:4000 (prefix stripped). Runs as the unprivileged `lynx` user, so every
# writable path points at /tmp and it listens on 8080.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format lynx '$time_iso8601 [nginx] $status $request_method $uri ${body_bytes_sent}b ${request_time}s';
    # Health checks arrive constantly; log them only when they fail.
    map "$status:$uri" $loggable {
        "~^2\d\d:/backend/healthz$" 0;
        default                     1;
    }
    access_log /dev/stdout lynx if=$loggable;

    # Client address. Without a declared front proxy, $remote_addr is the socket peer and every
    # forwarded header from the client is ignored. With TRUSTED_PROXIES (comma-separated CIDRs of
    # the reverse proxy in front, e.g. Nginx Proxy Manager's Docker network) the entrypoint writes
    # set_real_ip_from / real_ip_header here, so $remote_addr becomes the address that proxy saw
    # (REAL_IP_HEADER, default X-Forwarded-For; CF-Connecting-IP behind Cloudflare with Cloudflare's
    # ranges in TRUSTED_PROXIES). See docker/entrypoint.sh.
    include /tmp/nginx-realip.conf;

    # Per-address limits ($remote_addr after real_ip). Sign-in is strict (the bot also limits it);
    # images are generous (a queue page loads many covers at once); WebSockets are capped per address.
    limit_req_zone  $binary_remote_addr zone=lynx_auth:10m rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=lynx_media:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=lynx_ws:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # WebSocket (/backend/ws) needs the upgrade passed on.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Public health report (location below): per-IP limit for uptime monitors.
    limit_req_zone $binary_remote_addr zone=lynx_health:1m rate=10r/s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;

        # Security headers (CSP for the panel, nosniff, referrer, permissions): docker/nginx-headers.conf.
        # nginx drops inherited add_header lines in a location that sets its own, so every location
        # with add_header includes the file again.
        include /etc/nginx/lynx-headers.conf;

        root /app/web;
        index index.html;

        # The panel only exists inside Discord: the Activity iframe is always loaded with
        # ?frame_id=... (plus instance_id, platform...). A page request without it is someone
        # opening the URL directly (search engine, browser): show the "Unauthorized" page (status 200,
        # so proxies and certificate tooling never see an error).
        # Static assets stay reachable (the panel needs them; alone they show nothing).
        error_page 403 =200 /unauthorized.html;
        location = /unauthorized.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            # Its own CSP: the page has two inline scripts (allowed by hash; recompute the hashes
            # when they change) and Google Fonts.
            add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-ox2raO4OLgvOst9F4SC8IrJvTHmeHByo02NGCuzQfo0=' 'sha256-CvrMbQrKMT2yzKDL15+lUDMsG4Bh5gJ59hslGyND5kw='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://discord.com https://*.discord.com https://discordapp.com https://*.discordsays.com" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # index.html is never cached, so a new build is picked up right away.
        location = /index.html {
            if ($arg_frame_id = "") { return 403; }
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/lynx-headers.conf;
        }

        location / {
            try_files $uri @panel;
        }

        location @panel {
            if ($arg_frame_id = "") { return 403; }
            rewrite ^ /index.html break;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/lynx-headers.conf;
        }

        # Hashed build output: cache forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/lynx-headers.conf;
            try_files $uri =404;
        }

        # Public health report for uptime monitors: /health, /health/ and /health/bots/N. Not
        # behind the frame_id gate; the backend caches it for 5 s. Over the limit answers 429 (not
        # the default 503, which a monitor would read as "down").
        location ~ "^/health(/|/bots/[0-9]{1,2})?$" {
            limit_req zone=lynx_health burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Robots-Tag;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Backend: the prefix is stripped. Shared proxy settings; the locations below only add
        # limits. X-Real-IP and X-Forwarded-For are overwritten with the address nginx trusts, so a
        # client cannot choose the address the bot rate-limits on.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Content-Type-Options;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location /backend/ {
            proxy_pass http://127.0.0.1:4000/;
            include /etc/nginx/lynx-backend-headers.conf;
        }

        location = /backend/api/auth {
            limit_req zone=lynx_auth burst=20 nodelay;
            proxy_pass http://127.0.0.1:4000/api/auth;
            include /etc/nginx/lynx-backend-headers.conf;
        }

        location = /backend/img {
            limit_req zone=lynx_media burst=400 nodelay;
            proxy_pass http://127.0.0.1:4000/img;
            include /etc/nginx/lynx-backend-headers.conf;
        }

        location /backend/cdn/ {
            limit_req zone=lynx_media burst=400 nodelay;
            proxy_pass http://127.0.0.1:4000/cdn/;
            include /etc/nginx/lynx-backend-headers.conf;
        }

        location = /backend/ws {
            limit_conn lynx_ws 20;
            proxy_pass http://127.0.0.1:4000/ws;
            include /etc/nginx/lynx-backend-headers.conf;
        }
    }
}
