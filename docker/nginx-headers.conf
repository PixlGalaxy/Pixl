# Security headers for the panel (included by nginx.conf at server level and in every location
# that sets its own add_header). Installed as /etc/nginx/lynx-headers.conf.
#
# CSP, checked against what the panel loads: scripts only from the build (/assets, /theme.js: no
# inline scripts, Discord's CSP forbids them too); styles from the build plus React style
# attributes; fonts bundled (@fontsource); images from the panel and the backend proxies
# (/backend/img, /backend/cdn) plus data:/blob:; fetch and the WebSocket to the same origin
# ('self' covers wss:// on the same host). frame-ancestors limits embedding to Discord (the panel
# runs in the Activity iframe, so X-Frame-Options must NOT be set).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://discord.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://discord.com https://*.discord.com https://discordapp.com https://*.discordsays.com" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
