# Headers for /backend/ responses (JSON, proxied images, the WebSocket). Nothing there is a page:
# a strict CSP keeps a proxied SVG or HTML answer from running anything if opened directly.
# Installed as /etc/nginx/lynx-backend-headers.conf.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
